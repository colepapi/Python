name: CI

on:
  push:
    branches: [Mini-Projects]
  pull_request:
    branches: [Mini-Projects]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      DB_NAME: expense_tracker_test
      DB_USER: expense_tracker
      DB_PASSWORD: ci-only-database-password
      JWT_SECRET_KEY: ci-only-jwt-secret-do-not-use-in-production
      PGADMIN_DEFAULT_EMAIL: ci@example.com
      PGADMIN_DEFAULT_PASSWORD: ci-only-pgadmin-password
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Compose configuration
        run: docker compose -f expense-tracker-app/compose.yaml config --quiet

      - name: Start the application stack
        run: docker compose -f expense-tracker-app/compose.yaml up --build --detach postgres api dashboard pgadmin

      - name: Smoke-test app and database integration
        run: python expense-tracker-app/tests/smoke_test.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f expense-tracker-app/compose.yaml logs

      - name: Stop services
        if: always()
        run: docker compose -f expense-tracker-app/compose.yaml down --volumes

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Mini-Projects'
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish app image
        uses: docker/build-push-action@v6
        with:
          context: ./expense-tracker-app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/expense-tracker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/expense-tracker:latest
